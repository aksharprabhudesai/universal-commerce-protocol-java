server.port=8082
ucp.provider=in-memory

# Advertised UCP 2026-08-25 transport bindings at /.well-known/ucp
ucp.services.rest-endpoint=http://localhost:8082/ucp/v1
ucp.services.mcp-endpoint=http://localhost:8082/ucp/mcp
ucp.services.a2a-endpoint=http://localhost:8082/.well-known/agent-card.json

# Configuration-driven AP2 Mandates extension (dev.ucp.common.payment.ap2_mandate)
ucp.ap2.enabled=true
ucp.ap2.key-id=storefront-ap2-2026
ucp.ap2.algorithm=ES256
ucp.ap2.require-checkout-mandate=true
ucp.ap2.allow-embedded-agent-jwk=true
