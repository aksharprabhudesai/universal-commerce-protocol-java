server.port=8082
ucp.provider=in-memory

# Advertised UCP 2026-08-25 transport bindings at /.well-known/ucp
ucp.services.rest-endpoint=http://localhost:8082/ucp/v1
ucp.services.mcp-endpoint=http://localhost:8082/ucp/mcp
ucp.services.a2a-endpoint=http://localhost:8082/.well-known/agent-card.json

# Required UCP 2026-08-25 payment_handlers registry declaration
ucp.payment-handlers[com.example.processor_tokenizer][0].id=processor_tokenizer
ucp.payment-handlers[com.example.processor_tokenizer][0].version=2026-08-25
ucp.payment-handlers[com.example.processor_tokenizer][0].spec=https://ucp.dev/2026-08-25/specification/payment/examples/processor-tokenizer-payment-handler/
ucp.payment-handlers[com.example.processor_tokenizer][0].schema=https://ucp.dev/2026-08-25/schemas/payment_handler.json
ucp.payment-handlers[com.example.processor_tokenizer][0].available-instruments[0].type=card
ucp.payment-handlers[com.example.processor_tokenizer][0].config.type=CARD

# Ed25519 (OKP / EdDSA) HTTP transport verification key published in top-level keys[]
ucp.keys[0].kid=storefront-wba-ed25519
ucp.keys[0].kty=OKP
ucp.keys[0].crv=Ed25519
ucp.keys[0].x=JrQLj5P_89iXES9-vFgrIy29clF9CC_oPPsw3c5D0bs
ucp.keys[0].alg=EdDSA

# Configuration-driven AP2 Mandates extension (dev.ucp.common.payment.ap2_mandate)
ucp.ap2.enabled=true
ucp.ap2.key-id=storefront-ap2-2026
ucp.ap2.algorithm=ES256
ucp.ap2.require-checkout-mandate=true
ucp.ap2.allow-embedded-agent-jwk=true
